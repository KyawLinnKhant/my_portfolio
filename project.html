  <script src="projects.js"></script>
  <script src="assets/cloud.js"></script>
  <script>
    (function () {
      // projects.js shows elements by inline style; hand them to the hidden attribute instead
      ['p-status', 'p-img', 'p-media'].forEach(function (id) {
        var el = document.getElementById(id);
        if (el && el.style.display && el.style.display !== 'none') { el.hidden = false; el.style.removeProperty('display'); }
      });
      // videos load on request: a thumbnail button stands in for each YouTube frame
      document.querySelectorAll('.yt-wrap iframe').forEach(function (f) {
        var m = f.src.match(/embed\/([\w-]{6,})/); if (!m) return;
        var id = m[1], wrap = f.parentElement, src = f.src;
        var b = document.createElement('button'); b.type = 'button'; b.className = 'yt-play';
        var hd = wrap.closest('.p-section') && wrap.closest('.p-section').querySelector('h3'); var label = hd ? hd.textContent : 'project video';
        b.setAttribute('aria-label', 'Play video: ' + label);
        var im = new Image(); im.src = 'https://i.ytimg.com/vi/' + id + '/hqdefault.jpg'; im.alt = ''; im.loading = 'lazy'; im.width = 480; im.height = 360;
        var l = document.createElement('span'); l.className = 'yt-play__label'; l.textContent = 'Play video';
        b.appendChild(im); b.appendChild(l); f.remove(); wrap.appendChild(b);
        b.addEventListener('click', function () { var n = document.createElement('iframe'); n.src = src + (src.indexOf('?') > -1 ? '&' : '?') + 'autoplay=1'; n.title = 'Video: ' + label; n.allow = 'accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture'; n.allowFullscreen = true; wrap.replaceChild(n, b); n.focus(); });
      });
      // injected media: lazy, async, and titled
      document.querySelectorAll('#p-sections img, #p-media img').forEach(function (im) { if (!im.loading) im.loading = 'lazy'; im.decoding = 'async'; });
      document.querySelectorAll('#p-sections iframe:not([title])').forEach(function (f) { var hd = f.closest('.p-section') && f.closest('.p-section').querySelector('h3'); f.title = 'Embedded media: ' + (hd ? hd.textContent : 'project'); f.removeAttribute('frameborder'); });
      // the robots built from their own CAD get their point cloud above the cover
      var MODEL = { 'sim2real-quad': ['quadruped', 'Lime marks where the four feet meet the ground.'], 'isaaclab-so-arm': ['so-arm', 'Lime marks the gripper jaws. Assembled from so_arm100.urdf at its zero pose.'], 'rl-balance': ['balance', 'Lime marks the two wheels it balances on, placed as the MuJoCo model places them.'], 'slam-turtlebot-ros': ['turtlebot', 'Lime marks the LDS 360° lidar the EKF SLAM reads.'] };
      var pid = new URLSearchParams(location.search).get('id') || 'rl-balance';
      if (MODEL[pid] && window.PointCloud) {
        var key = MODEL[pid][0];
        var fig = document.createElement('figure'); fig.className = 'frame p-model';
        fig.innerHTML = '<div class="frame__view ticks"><canvas role="img"></canvas><img class="cloud-still" src="assets/clouds/' + key + '.png" width="1200" height="900" alt=""></div><figcaption class="frame__foot"><p></p></figcaption>';
        var cv = fig.querySelector('canvas'), stl = fig.querySelector('img'), cap = fig.querySelector('p');
        var nm = (document.getElementById('p-title').textContent || 'robot');
        cv.setAttribute('aria-label', 'Point cloud of the ' + nm + ', assembled from its own CAD files. Drag or use the arrow keys to spin it.');
        stl.alt = 'Point cloud of the ' + nm;
        cap.textContent = MODEL[pid][1] + ' Drag to spin it any way.';
        var cover = document.getElementById('p-img'); cover.parentNode.insertBefore(fig, cover);
        var pc = window.PointCloud(cv, { pitch: 0.38, period: 60000 });
        window.PointCloud.load('assets/clouds/' + key + '.json').then(function (d) { pc.setData(d); }).catch(function () { document.documentElement.classList.add('no-cloud'); });
      }
      var t = document.getElementById('p-title');
      // next project, in the home page's order
      var order = ['drone-swarm','rl-balance','sim2real-quad','isaaclab-so-arm','picar-x-f1','smart-waste','chameleon-sre','slam-turtlebot-ros','searchrescue','dobot-pickplace','alphamini-bricklaying','handsign','esd','fcb-prediction','zigbee-communication','sensor-signal-processing','shibuya-traffic-light'];
      var cur = new URLSearchParams(location.search).get('id') || 'rl-balance', i = order.indexOf(cur), nx = document.getElementById('p-next');
      if (i > -1 && nx && window.PROJECTS) { var nid = order[(i + 1) % order.length], np = window.PROJECTS[nid]; if (np) { nx.href = 'project.html?id=' + nid; nx.textContent = 'Next: ' + np.title; nx.hidden = false; } }
      if (t && t.textContent !== 'Project') { var og = document.querySelector('meta[property="og:title"]'); if (og) og.content = t.textContent + ', Kyaw Linn Khant'; }
      if (t && t.textContent === 'Project not found') { var a = document.createElement('a'); a.className = 'btn btn--line'; a.href = 'index.html#projects'; a.textContent = 'See all projects'; t.insertAdjacentElement('afterend', a); a.style.marginTop = 'var(--space-lg)'; document.querySelector('.p-body').hidden = true; }
      if (t && t.textContent !== 'Project') document.title = t.textContent + ', Kyaw Linn Khant';
      var toggle = document.querySelector('.nav__toggle'), links = document.getElementById('nav-links');
      if (toggle && links) toggle.addEventListener('click', function () { var o = !links.classList.contains('is-open'); links.classList.toggle('is-open', o); toggle.setAttribute('aria-expanded', String(o)); });
    })();
  </script>
